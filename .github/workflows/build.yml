name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: universalspacenav
          path: build/libs/*.jar
      - name: Publish jar to dist branch
        run: |
          mkdir /tmp/dist && cp build/libs/*.jar /tmp/dist/
          cd /tmp/dist
          git init -q -b dist
          git config user.name "build"; git config user.email "build@users.noreply.github.com"
          git add . && git commit -qm "jar"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dist
